# Journaux reduits au strict necessaire pour garder un affichage lisible.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
org.hibernate.level=WARNING
# Le pool de connexions integre de Hibernate suffit pour un TP :
# son avertissement de demarrage est masque (logger reellement utilise par Hibernate 5.6).
org.hibernate.orm.connections.pooling.level=SEVERE
